name: TaxForensic forensic-core tests

on:
  push:
    branches:
      - development/forensic-core-v26.28
  pull_request:
    branches:
      - development/universal-financial-v26.27

permissions:
  contents: read

jobs:
  forensic-core:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile forensic core and tests
        run: python -m compileall -q src/taxforensic_forensic_core.py tests/test_forensic_core.py
      - name: Run deterministic forensic tests
        run: python -m unittest discover -s tests -p "test_forensic_core.py" -v
